# Refer for explanation to following link:
# https://lefthook.dev/configuration/

commit-msg:
  jobs:
    - name: Run commitlint to validate Conventional Commits
      run: npx commitlint --edit $1

pre-commit:
  parallel: true
  jobs:
    - name: Run TypeScript check
      run: npm run typecheck

    - name: Run linter for Git staged files
      run: npx oxlint --config .oxlintrc.json {staged_files} --deny-warnings
      glob: "*.{js,ts,jsx,tsx}"

pre-push:
  jobs:
    - name: Run application build
      run: npm run build

    - name: Run dependencies security check
      run: npm run security-check

    - name: Run unit tests
      run: npm run test:unit

    - name: Run integration tests
      run: npm run test:integration
